name: docs

on:
  push:
    branches: main

permissions:
  contents: write

jobs:
  publish-gh-page:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          install: true
          cache: true
      - name: Build docs site
        run: mise tasks run panvimdoc:docs
      - name: deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: public
