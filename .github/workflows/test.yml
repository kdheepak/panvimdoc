name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Run tests
        run: mise tasks run panvimdoc:test

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Run action smoke test
        run: mise tasks run panvimdoc:test-action

  pre-commit-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Run prek smoke test
        run: mise tasks run panvimdoc:test-prek
